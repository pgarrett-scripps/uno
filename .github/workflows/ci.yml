name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debuginfo: smaller objects, faster codegen and link, smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0

# Linux x86_64 only: uno-ms-lightgbm-sys links a vendored prebuilt
# lib_lightgbm.so (manylinux x86_64).
jobs:
  metadata:
    name: Citation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cffconvert==2.0.0
      - run: cffconvert --validate
      - uses: extractions/setup-just@v2
      - run: just cite-check
      - run: python -m json.tool .zenodo.json > /dev/null

  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check -p uno-ms --locked --no-default-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
      # `cargo publish --dry-run` cannot pass while koth-ms is a
      # git dependency; listing the packaged files still catches anything
      # that would be left out of (or leak into) the crates.
      - name: List packaged files
        run: |
          for p in uno-ms-lightgbm-sys uno-ms-core uno-ms; do
            echo "== $p"
            cargo package --list --locked -p "$p"
          done
