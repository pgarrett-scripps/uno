# uno configuration. All fields optional; shown values are the defaults.

[digest]
missed_cleavages = 2
min_len = 7
max_len = 50
cleave_at = "KR"
restrict = "P"
c_terminal = true
peptide_min_mass = 500.0
peptide_max_mass = 5000.0
max_variable_mods = 2
decoy_tag = "rev_"
generate_decoys = true
static_mods = { C = 57.02146 }
variable_mods = { M = [15.994915] }

[matching]
ppm_tolerance = 10.0
isotope_offsets = [-1, 0, 1]

[scoring]
# Candidate peptides kept per feature (targets and decoys each) before the
# discriminant. Too low silently drops real peptides before RT can rescue them:
# entrapment (human+yeast, single-run HeLa) gives 25→105 IDs, 50→208, 100→275,
# all at ~1% entrapment FDP. Default 50; raise toward 100 for max depth.
top_k = 50

# On-data RT fine-tuning: refit only the distilled MLP's linear readout over its
# frozen embedding on this run's confident hits. On by default (deterministic,
# entrapment-validated). Set both false to use the frozen model + PWL calibration.
ondata_rt = true
ondata_rt_finetune = true
ondata_rt_lambda = 1.0
