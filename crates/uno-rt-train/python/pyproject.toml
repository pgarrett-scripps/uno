[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uno-rt"
version = "0.1.0"
description = "Optional CNN retention-time training for Uno"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.scripts]
uno-rt = "uno_rt.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["uno_rt*"]

[tool.setuptools.package-data]
uno_rt = ["data/*.urtc"]
