[package]
name = "uno"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "uno"
path = "src/main.rs"

[dependencies]
uno-core = { path = "../uno-core" }
koth_ff.workspace = true
clap.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
csv.workspace = true
sha2 = "0.10"
tempfile = "3"

[features]
# Native Thermo .raw input in the built-in feature finder. Forwards to
# koth_ff's `thermo` feature: requires a .NET 8 runtime at build and run time.
# mzML works with no feature; Bruker .d works via koth_ff's default `tdf`.
thermo = ["koth_ff/thermo"]
