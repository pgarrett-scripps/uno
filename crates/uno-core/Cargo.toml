[package]
name = "uno-ms-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Search, scoring, FDR and quantitative contrast library behind the uno MS1-only search engine"
keywords = ["mass-spectrometry","proteomics","ms1","fdr"]
categories = ["science"]
readme = "../../README.md"

# The library keeps its original name, so code says `uno_core::`.
[lib]
name = "uno_core"

[dependencies]
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
anyhow.workspace = true
log.workspace = true
gbdt.workspace = true
uno-lightgbm-sys.workspace = true
sequoia-boost.workspace = true

sha2 = "0.10"
parquet = { version = "53.4", default-features = false, features = ["zstd"] }
tempfile = "3"
# DirectMS1Quant statistics (quant::directms1).
statrs = "0.18"
nalgebra = "0.33"
levenberg-marquardt = { version = "0.14", features = ["minpack-compat"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }
