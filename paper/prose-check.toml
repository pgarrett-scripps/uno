# Per-project exceptions to the checks in tools/prose_check.py.
#
# STYLE.md is the policy a person reads. This is the machine-checkable subset
# plus the exceptions this manuscript has earned. Every entry should be one a
# reviewer would accept, so write the reason next to it.
#
# `just prose-check --list-rules` prints every rule id and how to suppress it.
# `just prose-check --show-suppressed` lists what this file is currently hiding,
# which is worth running occasionally so nothing rots behind a suppression.

# Rules switched off entirely. Use this only for rules with no per-value form.
disable = []

[allow]
# Acronyms standard in mass spectrometry / proteomics: a JPR reader who needed
# "MS1" expanded would not be reading this journal. Where the manuscript does
# expand one at first use, that expansion stays; this list is what must not be
# NAGGED about. Carried from the pre-scaffold checker's vocabulary.
unexpanded-acronym = [
  "SI",   # Supporting Information, defined by the section it names
  # field
  "MS", "MS1", "MS2", "LC", "RT", "IM", "CCS", "FAIMS", "CV", "PSM", "PFM",
  "FDP", "TDC", "AUC", "ROC", "MBR", "LFQ", "TMT", "DIA", "DDA", "UPS", "UPS1",
  "BH", "KS", "PPM", "FASTA", "TSV", "MZML", "PRIDE", "PXD",
  # methods and models named by acronym throughout
  "LDA", "MLP", "CNN", "SVR", "GBDT", "RANSAC", "RNG", "ML", "CLI", "RSS",
  # repo files and section pointers that survive the inline-code stripper
  "RESULTS", "TODO",
]

# A word codespell calls a typo that is really a term of art.
misspelling = [
  "averagine",  # the averagine model (Senko 1995), not "averaging"
]
# Declared assets the manuscript deliberately does not embed: each figure's
# vector .pdf twin, written by style.save() beside the .png the paper renders
# and kept for the journal submission bundle. tbl.superseded is NOT allowed
# here: nothing includes it and that is a real question for the author.
orphaned-asset = [
  "fig.fig1-pipeline-pdf", "fig.fig2-headtohead-pdf", "fig.figs1-entrapment-pdf",
  "fig.fig4-quant-pdf", "fig.fig-astral-validation-pdf", "fig.fig-toc-graphic-pdf",
  "fig.figs1-fdp-curves-pdf", "fig.figs2-faims-pdf", "fig.figs3-resources-pdf",
  "fig.figs4-quality-columns-pdf", "fig.figs5-quant-detail-pdf",
  "fig.figs6-determinism-pdf", "fig.fig5-raw-mode-pdf", "fig.fig4-overlap-pdf",
  "fig.figs3-rt-predictor-pdf", "fig.figs4-rt-throughput-pdf",
  "fig.figs2-rt-model-pdf", "fig.figs7-koth-matrix-pdf",
]

# Thresholds. Omit any you are happy with.
[limits]
max-sentence-words = 40   # flags a run-on; STYLE.md aims for 25
opener-run = 3            # consecutive sentences opening with the same word
repeat-in-sentence = 3    # times a distinctive word may repeat in one sentence

[severity]
# (shipped severities stand; uno's list/bold rules are errors in the registry)

# [vocabulary.*] add/remove entries go here as the checker meets this field's
# vocabulary. See the scaffold's prose-check.toml for the syntax.
