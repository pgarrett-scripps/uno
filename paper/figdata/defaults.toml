# Every uno setting that has a default, with that default, read from
# DigestConfig::default(), MatchConfig::default() and ScoreConfig::default() at
# the pinned commit rather than transcribed from example_config.toml. The
# identification benchmark overrides only the three [digest] fields listed in the
# configuration above, two of which differ from the default shown here
# (max_len 50 -> 30; missed_cleavages is already 0). Searches at a nonzero seed
# set decoy_seed and scoring.seed to that value and change nothing else.

[digest]
# Fully-tryptic with no variable modifications, following the DirectMS1 convention.
missed_cleavages = 0
min_len = 7
max_len = 50
cleave_at = "KR"
restrict = "P"
c_terminal = true
peptide_min_mass = 500.0
peptide_max_mass = 5000.0
max_variable_mods = 2
decoy_tag = "rev_"
generate_decoys = true
static_mods = { C = 57.02146 }
variable_mods = { }
# Interior-residue shuffle against a per-protein residue pool, with a mass shift so
# that a decoy is not a mass twin of its target.
decoy_mass_shift = 11.0
decoy_shuffle = true
decoy_method = "shuffle"
decoy_order = 2
# The decoy stream's own seed. `--seed N` sets this and `scoring.seed` together.
decoy_seed = 0

[matching]
ppm_tolerance = 10.0
isotope_offsets = [-1, 0, 1]
min_charge = 1

[scoring]
# Shared seed for the RANSAC calibration sample, the cross-validation folds and
# the classifier's subsampling. The three optional per-stage overrides below are
# absent by default and take precedence over `--seed` when they are set.
seed = 0
# rt_seed, cv_seed, classifier_seed: unset

# Candidate peptides kept per feature, targets and decoys each, so up to 2*top_k.
top_k = 50

# Mass-anchor stage and the combined mass+RT deviation discriminant.
mass_anchor = true
mass_anchor_ppm = 10.0
discriminant = "deviation"
calibration_fdr = 0.01
bootstrap_rounds = 2
seed_min_runs_frac = 0.5
rt_calibrated = false

# On-data retention-time refit: the shipped model's embedding is frozen and only
# its readout is refitted on this run's confident identifications.
ondata_rt = true
ondata_rt_finetune = true
ondata_rt_lambda = 1.0

# Learned per-PFM rescorer (cross-validated gradient-boosted trees, pure-Rust
# sequoia-boost backend) followed by a cumulative-inclusion protein ensemble.
# Enabled by default and active in every search reported here.
ml_rescore = true
n_folds = 3
iterations = 100
max_depth = 6
shrinkage = 0.1
max_train_rows = 200000
